services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: pengaduan
      DB_PASS: pengaduan
      DB_NAME: db_pengaduan
      APP_BASE_URL: http://localhost:8080/
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: db_pengaduan
      MARIADB_USER: pengaduan
      MARIADB_PASSWORD: pengaduan
    volumes:
      - db_data:/var/lib/mysql
      - ./pengaduan_masyarakat_ci.sql:/docker-entrypoint-initdb.d/01-pengaduan.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: